name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.run_number) }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageMonitor
          path: build/ClaudeUsageMonitor.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ClaudeUsageMonitor.zip
          generate_release_notes: true
