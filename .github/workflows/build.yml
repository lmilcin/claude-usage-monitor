name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job below gets more.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.run_number) }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsageMonitor
          path: build/ClaudeUsageMonitor.zip
          if-no-files-found: error

  # Tag pushes only: publish the zip built above, with its SHA-256 and a signed
  # build provenance attestation so users can verify what they downloaded.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release
      id-token: write          # sign the attestation (Sigstore, via OIDC)
      attestations: write      # store the attestation
      artifact-metadata: write # artifact storage record for the attestation
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClaudeUsageMonitor

      - name: Checksum
        run: sha256sum ClaudeUsageMonitor.zip | tee ClaudeUsageMonitor.zip.sha256

      - name: Attest build provenance
        # GitHub only offers attestations for public repositories on non-Enterprise plans.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ClaudeUsageMonitor.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '### Verify your download'
            echo
            echo 'SHA-256 of `ClaudeUsageMonitor.zip`:'
            echo
            echo '```'
            cut -d' ' -f1 ClaudeUsageMonitor.zip.sha256
            echo '```'
            echo
            echo "See [Verify your download](https://github.com/${GH_REPO}#verify-your-download) for how to check it."
            echo
          } > notes.md
          gh release create "$TAG" ClaudeUsageMonitor.zip ClaudeUsageMonitor.zip.sha256 \
            --verify-tag --title "$TAG" --generate-notes --notes-file notes.md
